plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mc-stats-webui" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('yarnInstall', Exec) {
	workingDir file('web')
	if (isWindows) {
		commandLine 'cmd', '/c', 'corepack', 'yarn', 'install'
	} else {
		commandLine 'corepack', 'yarn', 'install'
	}
	inputs.files file('web/package.json'), file('web/yarn.lock')
	outputs.dir file('web/node_modules')
}

tasks.register('extractMcTextures', Exec) {
	dependsOn 'configureClientLaunch'
	def clientJar = file("${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-client.jar")
	inputs.file clientJar
	inputs.file file('scripts/extract_mc_textures.py')
	outputs.dir file('web/static/mc')
	outputs.file file('web/src/lib/mc/icons.json')
	if (isWindows) {
		commandLine 'cmd', '/c', 'python', 'scripts/extract_mc_textures.py'
	} else {
		commandLine 'python3', 'scripts/extract_mc_textures.py'
	}
}

tasks.register('yarnBuild', Exec) {
	dependsOn yarnInstall, extractMcTextures
	workingDir file('web')
	if (isWindows) {
		commandLine 'cmd', '/c', 'corepack', 'yarn', 'build'
	} else {
		commandLine 'corepack', 'yarn', 'build'
	}
	inputs.dir file('web/src')
	inputs.dir file('web/static')
	inputs.files file('web/package.json'), file('web/yarn.lock'), file('web/vite.config.ts'), file('web/tsconfig.json'), file('web/src/app.html')
	outputs.dir file('web/build')
}

processResources {
	dependsOn yarnBuild
	def version = project.version
	def minecraftVersion = project.minecraft_version
	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": minecraftVersion
	}

	from('web/build') {
		into 'assets/mc-stats-webui/web'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
